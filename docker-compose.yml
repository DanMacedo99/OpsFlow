services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - opsflow_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    image: opsflow-backend

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      CORS_ORIGIN: ${FRONTEND_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      TRUST_PROXY: "false"
      SESSION_COOKIE_SAME_SITE: lax

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - opsflow_network

    command: >
      sh -c "npm run migrate:up && npm start"


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${BACKEND_URL}
    image: opsflow-frontend
    ports:
    - "5173:80"
    depends_on:
    - backend
    networks:
    - opsflow_network


volumes:
  postgres_data:
    name: opsflow-postgres-data


networks:
  opsflow_network:
    name: opsflow-network